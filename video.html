<div class="player">


    <video id="meuVideo" preload="auto">
        <source
            src="videos/The Most Beautifully Animated Magic Spell You'll Ever See  Witch Hat Atelier - Crunchyroll (1080p, h264).mp4"
            type="video/mp4">

        Seu navegador não suporta esse tipo de arquivo.
    </video>


    <!-- ==========================================
     INDICADOR PLAY / PAUSE
     ========================================== -->

    <div class="indicador-play-pause" id="indicadorPlayPause">

        ▶

    </div>
    <!-- ==========================================
INDICADOR DE AVANÇO / RETROCESSO
========================================== -->

    <div class="indicador-seek" id="indicadorSeek">

        <img id="iconeSeek" src="videos/right.png" alt="Avançar 5 segundos">

    </div>


    <!-- ==========================================
INDICADOR DE CARREGAMENTO
========================================== -->

    <div class="indicador-loading" id="indicadorLoading">

        <img src="videos/loading.png" alt="Carregando">

    </div>

    <!-- ==========================================
     INDICADOR DE VOLUME
     ========================================== -->

    <div class="indicador-volume" id="indicadorVolume">

        <div class="volume-circulo">

            <img class="volume-icone" id="volumeIcone" src="videos/high-volume.png" alt="Ícone de Volume">

            <span class="volume-porcentagem" id="volumePorcentagem">

                100%

            </span>

        </div>

    </div>


    <!-- ==========================================
     CONTROLES
     ========================================== -->

    <div class="controles-container">

        <button wm-play class="btn-controle play" title="Play">

            ▶

        </button>


        <div wm-progresso class="progresso">

            <img id="personagem" src="videos/parado.png" alt="Personagem">

            <div class="barra-vermelha"></div>

        </div>


        <button wm-fullscreen class="btn-controle fullscreen" title="Tela cheia">

            ⛶

        </button>

    </div>


</div>

<!-- ==========================================
CONTROLE DE VOLUME EXTERNO
========================================== -->

<div class="controle-volume-externo speaker-esquerdo" data-speaker-volume>

    <div class="barra-volume-externa" data-volume-barra>

        <div class="trilho-volume-externo" data-volume-trilho>

            <div class="preenchimento-volume-externo" data-volume-preenchimento></div>

            <div class="thumb-volume-externo" data-volume-thumb></div>

        </div>

    </div>

    <img class="speaker-volume-imagem" data-volume-speaker src="videos/SpeakerLeft.png" alt="Speaker esquerdo">

</div>


<div class="controle-volume-externo speaker-direito" data-speaker-volume>

    <div class="barra-volume-externa" data-volume-barra>

        <div class="trilho-volume-externo" data-volume-trilho>

            <div class="preenchimento-volume-externo" data-volume-preenchimento></div>

            <div class="thumb-volume-externo" data-volume-thumb></div>

        </div>

    </div>

    <img class="speaker-volume-imagem" data-volume-speaker src="videos/SpeakerRight.png" alt="Speaker direito">

</div>
